<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador EVA 3D · Vista Limpia</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111413;
      color: #e5ece8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #111413;
      color: #9eb5ac;
      font-size: 13px;
      letter-spacing: 0.15em;
      z-index: 10;
    }
    #loading[hidden] { display: none; }

    /* Badge superior discreto */
    .top-badge {
      position: absolute;
      top: 20px;
      left: 24px;
      pointer-events: none;
      z-index: 5;
    }
    .top-badge h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: #f0f4f2;
      text-transform: uppercase;
    }
    .top-badge p {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #7d9189;
      margin-top: 4px;
    }

    /* Barra flotante inferior de modos */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(22, 28, 26, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(130, 160, 150, 0.22);
      padding: 6px 10px;
      border-radius: 30px;
      z-index: 5;
    }
    .btn {
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      background: transparent;
      border: 1px solid transparent;
      color: #9cb2a8;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }
    .btn.active, .btn[aria-pressed="true"] {
      color: #111413;
      background: #66fcf1;
      font-weight: 600;
      border-color: #66fcf1;
    }
    .btn.secondary {
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0;
      padding-left: 14px;
    }
    .btn.secondary:hover {
      color: #66fcf1;
    }

    .hint {
      position: absolute;
      bottom: 24px;
      right: 24px;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: #5d7068;
      pointer-events: none;
      text-align: right;
      line-height: 1.6;
    }
    @media (max-width: 600px) {
      .hint { display: none; }
      .bottom-bar { width: 92%; justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="loading">CARGANDO MODELO 3D…</div>

  <div class="top-badge">
    <h1>Explorador EVA</h1>
    <p>Modelo 3D limpio · Sin fondo</p>
  </div>

  <nav class="bottom-bar" aria-label="Modos del explorador">
    <button class="btn active" data-mode="idle" aria-pressed="true">Reposo (1)</button>
    <button class="btn" data-mode="turn" aria-pressed="false">Mirar (2)</button>
    <button class="btn" data-mode="scan" aria-pressed="false">Escáner (3)</button>
    <button class="btn" data-mode="walk" aria-pressed="false">Caminar (4)</button>
    <button id="reset-cam" class="btn secondary" type="button" title="Centrar cámara (R)">↺ Centrar</button>
  </nav>

  <div class="hint">
    Arrastra para orbitar<br>
    Rueda para zoom
  </div>

  <script type="module" src="./lab.js"></script>
</body>
</html>
