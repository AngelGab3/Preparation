<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estación · Vista 3D local</title>
<style>
html,body{height:100%;margin:0;background:#6b4939;color:#f5dfbe;font-family:system-ui,sans-serif}
#app{position:fixed;inset:0}canvas{display:block}
aside{position:fixed;z-index:2;left:28px;top:24px;background:#171c1ed9;border:1px solid #d19a63;padding:16px 20px;max-width:320px}
strong{font-size:22px;letter-spacing:.2em}p{line-height:1.4;font-size:13px}
a{color:#ffd5a0}
</style>
</head>
<body>
<div id="app"></div>
<aside><strong>ESTACIÓN EVA</strong><p>Vista local de la estación compacta. Arrastra para girar la cámara y usa la rueda para acercarte.</p><a href="/?dataset=jezero_test&amp;nointro=1">Volver al mapa</a></aside>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { scene, camera, renderer } from './src/scene.js';
import { createMarsHabitatMesh } from './src/artifacts3d.js';
scene.clear();
scene.background = new THREE.Color(0x815c48);
scene.fog = new THREE.Fog(0x815c48, 12, 35);
scene.add(new THREE.HemisphereLight(0xffe8c6, 0x4b322b, 2.8));
const sun = new THREE.DirectionalLight(0xffe3b3, 3.2);
sun.position.set(4, 8, 5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
const floor=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshStandardMaterial({color:0xb06b49,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const station=createMarsHabitatMesh();scene.add(station);
camera.up.set(0,1,0);camera.near=.05;camera.far=100;camera.fov=48;camera.updateProjectionMatrix();
camera.position.set(8.5,6.3,10);camera.lookAt(0,1.7,0);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.7,0);orbit.enableDamping=true;orbit.autoRotate=true;orbit.autoRotateSpeed=.6;
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);resize();
function frame(){requestAnimationFrame(frame);orbit.update();renderer.render(scene,camera)}
frame();
</script>
</body>
</html>
